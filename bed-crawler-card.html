<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>The Bed Crawler — Ghost Hunter Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #07080b;
    --slate: #181c24;
    --slate-deep: #0e1015;
    --fog: #6b7280;
    --fog-soft: rgba(107, 114, 128, .3);
    --tallow: #e0a860;
    --tallow-soft: rgba(224, 168, 96, .4);
    --dread: #c05d52;
    --relief: #d7e4ea;
    --ink: #e6e4e0;
    --ink-dim: #8b8f97;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    padding: 34px 18px 50px;
    background:
      radial-gradient(ellipse 620px 420px at 50% -8%, #14171f 0%, transparent 60%),
      var(--void);
    background-attachment: fixed;
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--ink);
  }

  /* ---------- header ---------- */
  .header { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .eyebrow {
    margin: 0;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--tallow);
    text-align: center;
  }
  .subhead {
    margin: 0;
    max-width: 300px;
    text-align: center;
    font-style: italic;
    font-weight: 400;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink-dim);
  }

  /* ---------- card frame ---------- */
  .frame {
    position: relative;
    width: min(88vw, 340px);
    padding: 16px 16px 0;
    border-radius: 20px 20px 12px 12px;
    background: linear-gradient(160deg, #3a3e46 0%, var(--slate) 45%, var(--slate-deep) 100%);
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, .7),
      inset 0 0 0 2px rgba(180, 185, 195, .1),
      0 24px 60px -16px rgba(0, 0, 0, .9);
  }
  .frame::before {
    content: '';
    position: absolute;
    top: -7px;
    left: 50%;
    width: 13px;
    height: 13px;
    margin-left: -6.5px;
    background: linear-gradient(135deg, #fff3dd, var(--tallow) 55%, #8a5a26);
    transform: rotate(45deg);
    border-radius: 2px;
    box-shadow: 0 0 14px 3px var(--tallow-soft), 0 0 0 1px rgba(0, 0, 0, .5);
  }

  .window {
    position: relative;
    border-radius: 11px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 20%, #171a21 0%, #0a0c10 62%, #050608 100%);
    box-shadow: inset 0 0 44px rgba(0, 0, 0, .9), inset 0 0 0 1px rgba(255, 255, 255, .04);
  }
  .window svg { display: block; width: 100%; height: auto; }

  #crawlerOuter {
    transition: transform .6s cubic-bezier(.22, .61, .36, 1);
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }
  #crawlerOuter.recoil { animation: recoil-punch .3s ease-out; }
  @keyframes recoil-punch {
    0% { filter: brightness(1); }
    30% { filter: brightness(1.7); }
    100% { filter: brightness(1); }
  }

  #crawlerInner {
    transform-box: fill-box;
    transform-origin: center;
    animation: creep-bob 4.2s ease-in-out infinite;
  }
  @keyframes creep-bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(3px) rotate(-1deg); }
  }

  .lamp-glow { animation: flicker 5s ease-in-out infinite; }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    48% { opacity: .85; }
    50% { opacity: .55; }
    52% { opacity: .9; }
    76% { opacity: .7; }
    78% { opacity: 1; }
  }

  .dust {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: var(--fog);
    pointer-events: none;
    animation: drift 8s linear infinite;
  }
  @keyframes drift {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: .55; }
    90% { opacity: .35; }
    100% { transform: translateY(-40px); opacity: 0; }
  }

  .plate { text-align: center; padding: 10px 8px 4px; }
  .plate h1 {
    margin: 2px 0 0;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    letter-spacing: .1em;
    font-size: clamp(21px, 5.8vw, 27px);
    color: var(--ink);
    text-shadow: 0 0 14px rgba(0, 0, 0, .8), 0 2px 0 #000;
  }
  .plate .kind {
    margin: 3px 0 0;
    font-style: italic;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: .03em;
    color: var(--ink-dim);
  }

  .bottom-skull {
    display: flex;
    justify-content: center;
    padding: 6px 0 12px;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .7));
  }

  /* ---------- HUD ---------- */
  .hud { width: min(88vw, 340px); display: flex; flex-direction: column; gap: 9px; }
  .hud-row {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .hud-row span:last-child { font-weight: 600; color: var(--ink); transition: color .3s ease; }
  .hud-row span:last-child.tense { color: var(--dread); }

  .distance-track {
    height: 11px;
    border-radius: 6px;
    background: var(--slate-deep);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
    overflow: hidden;
  }
  .distance-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #6b4a24, var(--tallow) 60%, #fff3dd);
    box-shadow: 0 0 12px var(--tallow-soft);
    transition: width .35s ease;
  }

  .play-btn {
    margin-top: 4px;
    padding: 14px 18px;
    min-height: 48px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(160deg, var(--tallow), #8a5a26);
    color: #241a0c;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .06em;
    cursor: pointer;
    box-shadow: 0 10px 22px -8px rgba(224, 168, 96, .5), inset 0 1px 0 rgba(255, 255, 255, .3);
  }
  .play-btn:active { transform: translateY(1px); }
  .play-btn:disabled { opacity: .45; cursor: default; }
  .play-btn:focus-visible,
  .reset-btn:focus-visible {
    outline: 2px solid var(--relief);
    outline-offset: 2px;
  }

  .footer-count {
    margin: 0;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--ink-dim);
  }
  .footer-count strong { font-weight: 600; color: var(--tallow); }

  /* ---------- victory overlay ---------- */
  .victory {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px;
    text-align: center;
    background: rgba(4, 5, 8, .92);
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease;
  }
  .victory.show { opacity: 1; pointer-events: auto; }
  .victory .title {
    margin: 0;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(18px, 5.2vw, 22px);
    letter-spacing: .08em;
    color: var(--relief);
    text-shadow: 0 0 22px rgba(215, 228, 234, .5);
  }
  .victory .detail {
    margin: 0;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: .04em;
  }
  .reset-btn {
    margin-top: 4px;
    padding: 10px 18px;
    min-height: 44px;
    border-radius: 9px;
    border: 1px solid var(--relief);
    background: transparent;
    color: var(--relief);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: .05em;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    #crawlerInner { animation: none !important; }
    .lamp-glow { animation: none !important; opacity: .85; }
    .dust { animation: none !important; opacity: .2; }
  }
</style>
</head>
<body>

  <div class="header">
    <p class="eyebrow">Ghost Hunter — live prototype</p>
    <p class="subhead">Every bar you play pushes it back under the bed — stop practicing, and it creeps a little closer.</p>
  </div>

  <div class="frame">
    <div class="window">
      <svg viewBox="0 0 300 320" aria-hidden="true">
        <defs>
          <radialGradient id="bodyFill" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#2b2e35"/>
            <stop offset="55%" stop-color="#111318"/>
            <stop offset="100%" stop-color="#050608"/>
          </radialGradient>
          <radialGradient id="headFill" cx="38%" cy="28%" r="70%">
            <stop offset="0%" stop-color="#33363d"/>
            <stop offset="50%" stop-color="#131519"/>
            <stop offset="100%" stop-color="#050608"/>
          </radialGradient>
          <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff6e6"/>
            <stop offset="45%" stop-color="#e0a860"/>
            <stop offset="100%" stop-color="#e0a860" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="drapeFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0c0e13"/>
            <stop offset="100%" stop-color="#0c0e13" stop-opacity="0"/>
          </linearGradient>
        </defs>

        <!-- bed -->
        <rect x="66" y="4" width="168" height="26" rx="10" fill="#12151b"/>
        <rect x="54" y="28" width="192" height="52" rx="8" fill="#0c0e13"/>
        <rect x="54" y="80" width="192" height="40" fill="url(#drapeFade)"/>

        <!-- nightstand + lamp -->
        <rect x="252" y="55" width="30" height="24" rx="2" fill="#14171d"/>
        <rect x="262" y="42" width="10" height="14" rx="2" fill="#1a1d24"/>
        <ellipse class="lamp-glow" cx="267" cy="38" rx="13" ry="9" fill="url(#lampGlow)"/>

        <!-- the crawler -->
        <g id="crawlerOuter">
          <g id="crawlerInner">
            <path d="M164 232 L188 246 L204 268" fill="none" stroke="#050608" stroke-width="7" stroke-linecap="round"/>
            <path d="M164 232 L188 246 L204 268" fill="none" stroke="#3a3f47" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
            <path d="M138 234 L118 250 L104 272" fill="none" stroke="#050608" stroke-width="7" stroke-linecap="round"/>
            <path d="M138 234 L118 250 L104 272" fill="none" stroke="#3a3f47" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>

            <ellipse cx="150" cy="224" rx="32" ry="19" fill="url(#bodyFill)" transform="rotate(-4 150 224)"/>

            <path d="M162 236 L182 258 L192 284" fill="none" stroke="#050608" stroke-width="7.5" stroke-linecap="round"/>
            <path d="M162 236 L182 258 L192 284" fill="none" stroke="#3a3f47" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
            <path d="M140 238 L120 262 L112 288" fill="none" stroke="#050608" stroke-width="7.5" stroke-linecap="round"/>
            <path d="M140 238 L120 262 L112 288" fill="none" stroke="#3a3f47" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>

            <ellipse cx="150" cy="252" rx="16" ry="21" fill="url(#headFill)"/>
            <ellipse cx="145" cy="243" rx="5" ry="9" fill="#2a2e35" opacity="0.35"/>
          </g>
        </g>
      </svg>

      <div class="victory" id="victory">
        <p class="title">Back Under the Bed</p>
        <p class="detail" id="victoryDetail">Pushed back in 4 reps.</p>
        <button class="reset-btn" id="resetBtn" type="button">Summon it again</button>
      </div>
    </div>

    <div class="plate">
      <h1>The Bed Crawler</h1>
      <p class="kind">Under-Bed Dweller</p>
    </div>

    <div class="bottom-skull">
      <svg viewBox="0 0 24 20" width="24" height="20" aria-hidden="true">
        <defs>
          <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c9cdd3"/>
            <stop offset="1" stop-color="#5d626c"/>
          </linearGradient>
        </defs>
        <circle cx="12" cy="8" r="7" fill="url(#metalGrad)"/>
        <path d="M5.3 9.5 a7 7 0 0 0 13.4 0 L17.6 14 a2 2 0 0 1 -2 1.7 h-7 a2 2 0 0 1 -2 -1.7 Z" fill="url(#metalGrad)"/>
        <circle cx="9" cy="8.3" r="1.7" fill="#0a0a0a"/>
        <circle cx="15" cy="8.3" r="1.7" fill="#0a0a0a"/>
        <polygon points="12,10 12.9,11.8 11.1,11.8" fill="#0a0a0a"/>
      </svg>
    </div>
  </div>

  <div class="hud">
    <div class="hud-row"><span>Distance</span><span id="distancePct">45%</span></div>
    <div class="distance-track"><div class="distance-fill" id="distanceFill"></div></div>
    <button class="play-btn" id="playBtn" type="button">🎸 Play a bar</button>
    <p class="footer-count">Ghosts banished this session: <strong id="defeatCount">–</strong></p>
  </div>

<script>
(function () {
  const PROXIMITY_START = 45;
  const RECOIL_STEP = 14;
  const DECAY_STEP = 4;
  const DECAY_FLOOR = 12;
  const DECAY_INTERVAL_MS = 2800;

  const crawlerOuter = document.getElementById('crawlerOuter');
  const distanceFill = document.getElementById('distanceFill');
  const distancePct = document.getElementById('distancePct');
  const playBtn = document.getElementById('playBtn');
  const resetBtn = document.getElementById('resetBtn');
  const defeatCountEl = document.getElementById('defeatCount');
  const victoryEl = document.getElementById('victory');
  const victoryDetail = document.getElementById('victoryDetail');
  const windowEl = document.querySelector('.window');

  let proximity = PROXIMITY_START;
  let defeated = 0;
  let hits = 0;
  let busy = false;

  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function applyProximityTransform() {
    const t = (100 - Math.max(proximity, 0)) / 100;
    const scale = 0.6 + t * 0.75;
    const ty = -26 + t * 60;
    crawlerOuter.style.transform = `translateY(${ty.toFixed(1)}px) scale(${scale.toFixed(3)})`;
  }

  function updateDistanceUI() {
    const shown = Math.max(proximity, 0);
    distanceFill.style.width = `${shown}%`;
    distancePct.textContent = `${shown}%`;
    distancePct.classList.toggle('tense', shown < 25);
    applyProximityTransform();
  }

  function punch() {
    crawlerOuter.classList.remove('recoil');
    crawlerOuter.getBoundingClientRect();
    crawlerOuter.classList.add('recoil');
  }

  function scatterDust(n) {
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      s.className = 'dust';
      s.style.left = `${Math.random() * 100}%`;
      s.style.top = `${40 + Math.random() * 55}%`;
      s.style.animationDelay = `${Math.random() * 8}s`;
      windowEl.appendChild(s);
    }
  }

  async function loadDefeats() {
    if (!window.storage) { defeatCountEl.textContent = '0'; return; }
    try {
      const res = await window.storage.get('bedcrawler:defeats');
      defeated = (res && res.value) ? (parseInt(res.value, 10) || 0) : 0;
    } catch (e) {
      defeated = 0;
    }
    defeatCountEl.textContent = defeated;
  }

  async function saveDefeats() {
    if (!window.storage) return;
    try {
      await window.storage.set('bedcrawler:defeats', String(defeated));
    } catch (e) {
      /* non-fatal: session count still shown, just won't persist */
    }
  }

  function tick() {
    if (busy) return;
    proximity = Math.max(DECAY_FLOOR, proximity - DECAY_STEP);
    updateDistanceUI();
  }

  function playBar() {
    if (busy) return;
    proximity = Math.min(100, proximity + RECOIL_STEP);
    hits += 1;
    punch();
    updateDistanceUI();

    if (proximity >= 100) {
      busy = true;
      playBtn.disabled = true;
      setTimeout(onBanish, 550);
    }
  }

  function onBanish() {
    defeated += 1;
    defeatCountEl.textContent = defeated;
    victoryDetail.textContent = `Pushed back in ${hits} reps.`;
    victoryEl.classList.add('show');
    saveDefeats();
  }

  function resetCrawler() {
    proximity = PROXIMITY_START;
    hits = 0;
    busy = false;
    playBtn.disabled = false;
    updateDistanceUI();
    victoryEl.classList.remove('show');
  }

  playBtn.addEventListener('click', playBar);
  resetBtn.addEventListener('click', resetCrawler);

  updateDistanceUI();
  scatterDust(6);
  loadDefeats();

  if (!reduceMotion) {
    setInterval(tick, DECAY_INTERVAL_MS);
  }
})();
</script>
</body>
</html>
