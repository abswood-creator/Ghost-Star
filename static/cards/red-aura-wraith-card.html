<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Red-Aura Wraith — Ghost Hunter Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0a0607;
    --slate: #241a1c;
    --slate-deep: #120c0d;
    --ember: #e2483a;
    --ember-soft: rgba(226, 72, 58, .4);
    --relief: #cddbc9;
    --ink: #e6e4e0;
    --ink-dim: #8b8f97;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    padding: 34px 18px 50px;
    background:
      radial-gradient(ellipse 620px 420px at 50% -8%, #241412 0%, transparent 60%),
      var(--void);
    background-attachment: fixed;
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--ink);
  }

  .header { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .eyebrow {
    margin: 0;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ember);
    text-align: center;
  }
  .subhead {
    margin: 0;
    max-width: 300px;
    text-align: center;
    font-style: italic;
    font-weight: 400;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink-dim);
  }

  .frame {
    position: relative;
    width: min(88vw, 340px);
    padding: 16px 16px 0;
    border-radius: 20px 20px 12px 12px;
    background: linear-gradient(160deg, #4a3436 0%, var(--slate) 45%, var(--slate-deep) 100%);
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, .7),
      inset 0 0 0 2px rgba(210, 190, 185, .1),
      0 24px 60px -16px rgba(0, 0, 0, .9),
      0 0 60px -18px var(--ember-soft);
  }
  .frame::before {
    content: '';
    position: absolute;
    top: -7px;
    left: 50%;
    width: 13px;
    height: 13px;
    margin-left: -6.5px;
    background: linear-gradient(135deg, #ffcfc4, var(--ember) 55%, #7a1f16);
    transform: rotate(45deg);
    border-radius: 2px;
    box-shadow: 0 0 14px 3px var(--ember-soft), 0 0 0 1px rgba(0, 0, 0, .5);
  }

  .window {
    position: relative;
    border-radius: 11px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #1c1210 0%, #0d0807 68%, #050303 100%);
    box-shadow: inset 0 0 44px rgba(0, 0, 0, .9), inset 0 0 0 1px rgba(255, 255, 255, .04);
  }
  .window svg { display: block; width: 100%; height: auto; }

  #wraithFigure {
    transform-box: fill-box;
    transform-origin: center;
    animation: wraith-float 6s ease-in-out infinite;
  }
  @keyframes wraith-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  #wraithGroup.recoil { animation: recoil-flash .3s ease-out; }
  @keyframes recoil-flash {
    0% { filter: brightness(1); }
    30% { filter: brightness(1.6); }
    100% { filter: brightness(1); }
  }

  .plate { text-align: center; padding: 10px 8px 4px; }
  .plate h1 {
    margin: 2px 0 0;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    letter-spacing: .09em;
    font-size: clamp(20px, 5.6vw, 26px);
    color: var(--ink);
    text-shadow: 0 0 14px var(--ember-soft), 0 2px 0 #000;
  }
  .plate .kind {
    margin: 3px 0 0;
    font-style: italic;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: .03em;
    color: var(--ink-dim);
  }

  .bottom-skull {
    display: flex;
    justify-content: center;
    padding: 6px 0 12px;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .7));
  }

  .hud { width: min(88vw, 340px); display: flex; flex-direction: column; gap: 9px; }
  .hud-row {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .hud-row span:last-child { font-weight: 600; color: var(--ink); }

  .aura-track {
    height: 11px;
    border-radius: 6px;
    background: var(--slate-deep);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
    overflow: hidden;
  }
  .aura-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #7a1f16, var(--ember) 60%, #ffcfc4);
    box-shadow: 0 0 12px var(--ember-soft);
    transition: width .35s ease;
  }

  .play-btn {
    margin-top: 4px;
    padding: 14px 18px;
    min-height: 48px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(160deg, var(--ember), #7a1f16);
    color: #fff5f2;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .06em;
    cursor: pointer;
    box-shadow: 0 10px 22px -8px rgba(226, 72, 58, .55), inset 0 1px 0 rgba(255, 255, 255, .25);
  }
  .play-btn:active { transform: translateY(1px); }
  .play-btn:disabled { opacity: .45; cursor: default; }
  .play-btn:focus-visible,
  .reset-btn:focus-visible {
    outline: 2px solid var(--relief);
    outline-offset: 2px;
  }

  .footer-count {
    margin: 0;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--ink-dim);
  }
  .footer-count strong { font-weight: 600; color: var(--ember); }

  .victory {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px;
    text-align: center;
    background: rgba(4, 3, 3, .92);
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease;
  }
  .victory.show { opacity: 1; pointer-events: auto; }
  .victory .title {
    margin: 0;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(18px, 5.2vw, 22px);
    letter-spacing: .08em;
    color: var(--relief);
    text-shadow: 0 0 22px rgba(205, 219, 201, .5);
  }
  .victory .detail {
    margin: 0;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: .04em;
  }
  .reset-btn {
    margin-top: 4px;
    padding: 10px 18px;
    min-height: 44px;
    border-radius: 9px;
    border: 1px solid var(--relief);
    background: transparent;
    color: var(--relief);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: .05em;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    #wraithFigure { animation: none !important; }
  }
</style>
</head>
<body>

  <div class="header">
    <p class="eyebrow">Ghost Hunter — live prototype</p>
    <p class="subhead">Every solo you play burns the aura down — it doesn't creep back, so the ground you take stays taken.</p>
  </div>

  <div class="frame">
    <div class="window">
      <svg viewBox="0 0 300 320" aria-hidden="true">
        <defs>
          <radialGradient id="robeFill" cx="50%" cy="25%" r="70%">
            <stop offset="0%" stop-color="#e8e4e0"/>
            <stop offset="60%" stop-color="#8f8a88"/>
            <stop offset="100%" stop-color="#8f8a88" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="skullFill" cx="42%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#f0ebe4"/>
            <stop offset="55%" stop-color="#c4bcb2"/>
            <stop offset="100%" stop-color="#8a8078"/>
          </radialGradient>
          <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff0e8"/>
            <stop offset="50%" stop-color="#e2483a"/>
            <stop offset="100%" stop-color="#e2483a" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <g id="wraithGroup">
          <g id="tendrilsGroup"></g>
          <g id="wraithFigure">
            <ellipse cx="150" cy="150" rx="38" ry="30" fill="url(#robeFill)" opacity="0.85"/>
            <ellipse cx="150" cy="195" rx="30" ry="55" fill="url(#robeFill)" opacity="0.55"/>
            <ellipse cx="150" cy="250" rx="20" ry="45" fill="url(#robeFill)" opacity="0.25"/>

            <ellipse cx="150" cy="115" rx="24" ry="27" fill="url(#skullFill)"/>
            <ellipse cx="140" cy="110" rx="7" ry="9" fill="#1a0806"/>
            <ellipse cx="160" cy="110" rx="7" ry="9" fill="#1a0806"/>
            <circle cx="140" cy="111" r="2.6" fill="url(#emberGlow)"/>
            <circle cx="160" cy="111" r="2.6" fill="url(#emberGlow)"/>
            <ellipse cx="150" cy="128" rx="6" ry="8" fill="#1a0806"/>
          </g>
        </g>
      </svg>

      <div class="victory" id="victory">
        <p class="title">The Fire Goes Out</p>
        <p class="detail" id="victoryDetail">Burned down in 5 reps.</p>
        <button class="reset-btn" id="resetBtn" type="button">Summon it again</button>
      </div>
    </div>

    <div class="plate">
      <h1>Red-Aura Wraith</h1>
      <p class="kind">Wreathed in Red</p>
    </div>

    <div class="bottom-skull">
      <svg viewBox="0 0 24 20" width="24" height="20" aria-hidden="true">
        <defs>
          <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d9c2c0"/>
            <stop offset="1" stop-color="#6c5250"/>
          </linearGradient>
        </defs>
        <circle cx="12" cy="8" r="7" fill="url(#metalGrad)"/>
        <path d="M5.3 9.5 a7 7 0 0 0 13.4 0 L17.6 14 a2 2 0 0 1 -2 1.7 h-7 a2 2 0 0 1 -2 -1.7 Z" fill="url(#metalGrad)"/>
        <circle cx="9" cy="8.3" r="1.7" fill="#0a0a0a"/>
        <circle cx="15" cy="8.3" r="1.7" fill="#0a0a0a"/>
        <polygon points="12,10 12.9,11.8 11.1,11.8" fill="#0a0a0a"/>
      </svg>
    </div>
  </div>

  <div class="hud">
    <div class="hud-row"><span>Aura</span><span id="auraPct">100%</span></div>
    <div class="aura-track"><div class="aura-fill" id="auraFill"></div></div>
    <button class="play-btn" id="playBtn" type="button">🎸 Play a solo</button>
    <p class="footer-count">Ghosts banished this session: <strong id="defeatCount">–</strong></p>
  </div>

<script>
(function () {
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const AURA_STEP = 20;

  const wraithGroup = document.getElementById('wraithGroup');
  const tendrilsGroup = document.getElementById('tendrilsGroup');
  const auraFill = document.getElementById('auraFill');
  const auraPct = document.getElementById('auraPct');
  const playBtn = document.getElementById('playBtn');
  const resetBtn = document.getElementById('resetBtn');
  const defeatCountEl = document.getElementById('defeatCount');
  const victoryEl = document.getElementById('victory');
  const victoryDetail = document.getElementById('victoryDetail');

  let aura = 100;
  let defeated = 0;
  let hits = 0;
  let busy = false;
  let animStart = null;
  let lastFrameTime = 0;

  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  const TENDRILS = [
    { angle: -155, length: 95,  phase: 0.0, ox: 128, oy: 145 },
    { angle: -120, length: 110, phase: 1.1, ox: 138, oy: 130 },
    { angle: -80,  length: 100, phase: 2.3, ox: 150, oy: 120 },
    { angle: -40,  length: 108, phase: 3.4, ox: 163, oy: 130 },
    { angle: -8,   length: 92,  phase: 4.2, ox: 172, oy: 145 },
    { angle: 205,  length: 85,  phase: 5.0, ox: 140, oy: 165 }
  ];

  const tendrilElements = TENDRILS.map(function () {
    const glow = document.createElementNS(SVG_NS, 'path');
    glow.setAttribute('fill', 'none');
    glow.setAttribute('stroke', '#e2483a');
    glow.setAttribute('stroke-width', '4');
    glow.setAttribute('stroke-linecap', 'round');
    const core = document.createElementNS(SVG_NS, 'path');
    core.setAttribute('fill', 'none');
    core.setAttribute('stroke', '#ffb199');
    core.setAttribute('stroke-width', '1.3');
    core.setAttribute('stroke-linecap', 'round');
    tendrilsGroup.appendChild(glow);
    tendrilsGroup.appendChild(core);
    return { glow: glow, core: core };
  });

  function updateTendrilPaths(t) {
    const auraFactor = Math.max(aura, 0) / 100;
    TENDRILS.forEach(function (td, idx) {
      const rad = td.angle * Math.PI / 180;
      const dx = Math.cos(rad), dy = Math.sin(rad);
      const perpX = -dy, perpY = dx;
      const len = td.length * (0.4 + auraFactor * 0.6);
      const segments = 7;
      let d = `M ${td.ox} ${td.oy}`;
      for (let i = 1; i <= segments; i++) {
        const frac = i / segments;
        const baseX = td.ox + dx * len * frac;
        const baseY = td.oy + dy * len * frac;
        const wave = Math.sin(frac * Math.PI * 2.2 + t * 1.6 + td.phase) * 10 * frac;
        const px = baseX + perpX * wave;
        const py = baseY + perpY * wave;
        d += ` L ${px.toFixed(1)} ${py.toFixed(1)}`;
      }
      const els = tendrilElements[idx];
      els.glow.setAttribute('d', d);
      els.glow.setAttribute('opacity', (0.55 * auraFactor + 0.1).toFixed(2));
      els.core.setAttribute('d', d);
      els.core.setAttribute('opacity', (0.7 * auraFactor + 0.1).toFixed(2));
    });
  }

  function frameLoop(timestamp) {
    if (timestamp - lastFrameTime >= 33) {
      lastFrameTime = timestamp;
      if (animStart === null) animStart = timestamp;
      updateTendrilPaths((timestamp - animStart) / 1000);
    }
    requestAnimationFrame(frameLoop);
  }

  function punch() {
    wraithGroup.classList.remove('recoil');
    wraithGroup.getBoundingClientRect();
    wraithGroup.classList.add('recoil');
  }

  function updateAuraUI() {
    const shown = Math.max(aura, 0);
    auraFill.style.width = `${shown}%`;
    auraPct.textContent = `${shown}%`;
  }

  async function loadDefeats() {
    if (!window.storage) { defeatCountEl.textContent = '0'; return; }
    try {
      const res = await window.storage.get('redaurawraith:defeats');
      defeated = (res && res.value) ? (parseInt(res.value, 10) || 0) : 0;
    } catch (e) {
      defeated = 0;
    }
    defeatCountEl.textContent = defeated;
  }

  async function saveDefeats() {
    if (!window.storage) return;
    try {
      await window.storage.set('redaurawraith:defeats', String(defeated));
    } catch (e) {
      /* non-fatal: session count still shown, just won't persist */
    }
  }

  function playSolo() {
    if (busy || aura <= 0) return;
    aura = Math.max(0, aura - AURA_STEP);
    hits += 1;
    punch();
    updateAuraUI();

    if (aura <= 0) {
      busy = true;
      playBtn.disabled = true;
      setTimeout(onBanish, 550);
    }
  }

  function onBanish() {
    defeated += 1;
    defeatCountEl.textContent = defeated;
    victoryDetail.textContent = `Burned down in ${hits} reps.`;
    victoryEl.classList.add('show');
    saveDefeats();
  }

  function resetWraith() {
    aura = 100;
    hits = 0;
    busy = false;
    playBtn.disabled = false;
    updateAuraUI();
    victoryEl.classList.remove('show');
  }

  playBtn.addEventListener('click', playSolo);
  resetBtn.addEventListener('click', resetWraith);

  updateAuraUI();
  loadDefeats();

  if (!reduceMotion) {
    requestAnimationFrame(frameLoop);
  } else {
    updateTendrilPaths(0);
  }
})();

const part1 = document.getElementById('songPart1');
const part2 = document.getElementById('songPart2');

// When part 1 ends → automatically play part 2
part1.addEventListener('ended', () => {
  part2.currentTime = 0;
  part2.play().catch(() => {});
});

function playFullSong() {
  // Stop both first (in case it’s already playing)
  part1.pause();
  part2.pause();
  part1.currentTime = 0;
  part2.currentTime = 0;

  // Start from the beginning
  part1.play().catch(() => {});
}

// Call this when the win happens
function onGhostBanished() {
  playFullSong();
}

if (ghostWasBanished) {
  onGhostBanished();
}
</script>
</body>
</html>
