<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Rockstar Specter — Ghost Hunter Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #050506;
    --slate: #1c1a20;
    --slate-deep: #0d0c0f;
    --electric: #7ee8ff;
    --electric-soft: rgba(126, 232, 255, .4);
    --spotlight: #fff4d6;
    --spotlight-soft: rgba(255, 244, 214, .3);
    --gold: #e8c468;
    --gold-soft: rgba(232, 196, 104, .4);
    --relief: #f2d68a;
    --ink: #e6e4e0;
    --ink-dim: #8b8f97;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    padding: 34px 18px 50px;
    background:
      radial-gradient(ellipse 620px 420px at 50% -8%, #1c1610 0%, transparent 60%),
      var(--void);
    background-attachment: fixed;
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--ink);
  }

  .header { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .eyebrow {
    margin: 0;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--gold);
    text-align: center;
  }
  .subhead {
    margin: 0;
    max-width: 300px;
    text-align: center;
    font-style: italic;
    font-weight: 400;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink-dim);
  }

  .frame {
    position: relative;
    width: min(88vw, 340px);
    padding: 16px 16px 0;
    border-radius: 20px 20px 12px 12px;
    background: linear-gradient(160deg, #3a3630 0%, var(--slate) 45%, var(--slate-deep) 100%);
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, .7),
      inset 0 0 0 2px rgba(215, 205, 185, .12),
      0 24px 60px -16px rgba(0, 0, 0, .9),
      0 0 60px -16px var(--gold-soft),
      0 0 50px -20px var(--electric-soft);
  }
  .frame::before {
    content: '';
    position: absolute;
    top: -7px;
    left: 50%;
    width: 13px;
    height: 13px;
    margin-left: -6.5px;
    background: linear-gradient(135deg, #fff8e0, var(--gold) 55%, #7a5f28);
    transform: rotate(45deg);
    border-radius: 2px;
    box-shadow: 0 0 14px 3px var(--gold-soft), 0 0 0 1px rgba(0, 0, 0, .5);
  }

  .window {
    position: relative;
    border-radius: 11px;
    overflow: hidden;
    background: #030304;
    box-shadow: inset 0 0 44px rgba(0, 0, 0, .9), inset 0 0 0 1px rgba(255, 255, 255, .04);
  }
  .window svg { display: block; width: 100%; height: auto; }

  #spotlightBeam { animation: beam-pulse 4s ease-in-out infinite; }
  @keyframes beam-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .8; }
  }

  #specterFigure {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: sway 4.5s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(1.5deg); }
  }
  #specterGroup.recoil { animation: recoil-flash .3s ease-out; }
  @keyframes recoil-flash {
    0% { filter: brightness(1); }
    30% { filter: brightness(1.7); }
    100% { filter: brightness(1); }
  }

  .ember {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--electric);
    box-shadow: 0 0 6px 2px var(--electric-soft);
    pointer-events: none;
    animation: ember-rise 3s ease-out infinite;
  }
  @keyframes ember-rise {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: .8; }
    100% { transform: translateY(-70px); opacity: 0; }
  }

  .plate { text-align: center; padding: 10px 8px 4px; }
  .plate h1 {
    margin: 2px 0 0;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    letter-spacing: .1em;
    font-size: clamp(21px, 5.8vw, 27px);
    color: var(--ink);
    text-shadow: 0 0 16px var(--gold-soft), 0 2px 0 #000;
  }
  .plate .kind {
    margin: 3px 0 0;
    font-style: italic;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .bottom-skull {
    display: flex;
    justify-content: center;
    padding: 6px 0 12px;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .7));
  }

  .hud { width: min(88vw, 340px); display: flex; flex-direction: column; gap: 9px; }
  .hud-row {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .hud-row span:last-child { font-weight: 600; color: var(--ink); }

  .presence-track {
    height: 11px;
    border-radius: 6px;
    background: var(--slate-deep);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
    overflow: hidden;
  }
  .presence-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #7a5f28, var(--gold) 60%, #fff3d2);
    box-shadow: 0 0 12px var(--gold-soft);
    transition: width .35s ease;
  }

  .play-btn {
    margin-top: 4px;
    padding: 14px 18px;
    min-height: 48px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(160deg, var(--gold), #7a5f28);
    color: #2a1f0c;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .06em;
    cursor: pointer;
    box-shadow: 0 10px 22px -8px rgba(232, 196, 104, .55), inset 0 1px 0 rgba(255, 255, 255, .3);
  }
  .play-btn:active { transform: translateY(1px); }
  .play-btn:disabled { opacity: .45; cursor: default; }
  .play-btn:focus-visible,
  .reset-btn:focus-visible {
    outline: 2px solid var(--relief);
    outline-offset: 2px;
  }

  .footer-count {
    margin: 0;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--ink-dim);
  }
  .footer-count strong { font-weight: 600; color: var(--gold); }

  .encore-flash {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, .6);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .encore-flash.show { opacity: 1; }
  .encore-flash p {
    margin: 0;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(24px, 7vw, 32px);
    letter-spacing: .1em;
    color: var(--spotlight);
    text-shadow: 0 0 30px var(--spotlight-soft), 0 0 60px var(--electric-soft);
  }

  .victory {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px;
    text-align: center;
    background: rgba(3, 3, 4, .93);
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease;
  }
  .victory.show { opacity: 1; pointer-events: auto; }
  .victory .title {
    margin: 0;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(19px, 5.6vw, 24px);
    letter-spacing: .09em;
    color: var(--relief);
    text-shadow: 0 0 24px rgba(242, 214, 138, .55);
  }
  .victory .detail {
    margin: 0;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: .04em;
  }
  .reset-btn {
    margin-top: 4px;
    padding: 10px 18px;
    min-height: 44px;
    border-radius: 9px;
    border: 1px solid var(--relief);
    background: transparent;
    color: var(--relief);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: .05em;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    #spotlightBeam { animation: none !important; }
    #specterFigure { animation: none !important; }
    .ember { animation: none !important; opacity: .2; }
  }
</style>
</head>
<body>

  <div class="header">
    <p class="eyebrow">Ghost Hunter — live prototype</p>
    <p class="subhead">Every riff drains its stage presence — empty the bar once, and it comes back for one last encore.</p>
  </div>

  <div class="frame">
    <div class="window">
      <svg viewBox="0 0 300 320" aria-hidden="true">
        <defs>
          <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff4d6" stop-opacity="0.5"/>
            <stop offset="60%" stop-color="#fff4d6" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#fff4d6" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="jacketFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2a2a2e"/>
            <stop offset="50%" stop-color="#141416"/>
            <stop offset="100%" stop-color="#050506"/>
          </linearGradient>
          <radialGradient id="headFill" cx="42%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#f0ebe4"/>
            <stop offset="55%" stop-color="#c4bcb2"/>
            <stop offset="100%" stop-color="#8a8078"/>
          </radialGradient>
          <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e8e6e2"/>
            <stop offset="100%" stop-color="#8a8886"/>
          </linearGradient>
        </defs>

        <polygon id="spotlightBeam" points="150,0 90,320 210,320" fill="url(#beamGrad)"/>

        <g id="specterGroup">
          <g id="boltsGroup"></g>

          <g id="specterFigure">
            <path d="M128 220 L120 290 L136 290 L142 222 Z" fill="#0d0d10"/>
            <path d="M172 220 L180 290 L164 290 L158 222 Z" fill="#0d0d10"/>
            <rect x="114" y="286" width="26" height="12" rx="3" fill="#050506"/>
            <rect x="160" y="286" width="26" height="12" rx="3" fill="#050506"/>

            <path d="M124 150 L176 150 L182 222 L118 222 Z" fill="url(#jacketFill)"/>

            <g transform="rotate(-25 150 195)">
              <ellipse cx="150" cy="205" rx="22" ry="16" fill="#3a1810"/>
              <ellipse cx="150" cy="182" rx="15" ry="12" fill="#3a1810"/>
              <rect x="147" y="130" width="6" height="60" fill="#1a0d08"/>
              <rect x="145" y="128" width="10" height="6" fill="#0d0705"/>
            </g>

            <path d="M130 105 Q100 90 85 130 Q78 160 95 175" fill="none" stroke="url(#hairGrad)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
            <path d="M170 105 Q200 90 215 130 Q222 160 205 175" fill="none" stroke="url(#hairGrad)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
            <path d="M138 98 Q120 70 100 75" fill="none" stroke="url(#hairGrad)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
            <path d="M162 98 Q180 70 200 75" fill="none" stroke="url(#hairGrad)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>

            <ellipse cx="150" cy="118" rx="20" ry="24" fill="url(#headFill)"/>
            <rect x="132" y="112" width="36" height="10" rx="4" fill="#0a0a0c"/>
          </g>
        </g>
      </svg>

      <div class="encore-flash" id="encoreFlash"><p>Encore!</p></div>

      <div class="victory" id="victory">
        <p class="title">Final Bow</p>
        <p class="detail" id="victoryDetail">Cleared in 9 reps across 2 phases.</p>
        <button class="reset-btn" id="resetBtn" type="button">Summon it again</button>
      </div>
    </div>

    <div class="plate">
      <h1>Rockstar Specter</h1>
      <p class="kind">Final Boss</p>
    </div>

    <div class="bottom-skull">
      <svg viewBox="0 0 24 20" width="24" height="20" aria-hidden="true">
        <defs>
          <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e0d2a8"/>
            <stop offset="1" stop-color="#8a7550"/>
          </linearGradient>
        </defs>
        <circle cx="12" cy="8" r="7" fill="url(#metalGrad)"/>
        <path d="M5.3 9.5 a7 7 0 0 0 13.4 0 L17.6 14 a2 2 0 0 1 -2 1.7 h-7 a2 2 0 0 1 -2 -1.7 Z" fill="url(#metalGrad)"/>
        <circle cx="9" cy="8.3" r="1.7" fill="#0a0a0a"/>
        <circle cx="15" cy="8.3" r="1.7" fill="#0a0a0a"/>
        <polygon points="12,10 12.9,11.8 11.1,11.8" fill="#0a0a0a"/>
      </svg>
    </div>
  </div>

  <div class="hud">
    <div class="hud-row"><span id="presenceLabel">Presence</span><span id="presencePct">100%</span></div>
    <div class="presence-track"><div class="presence-fill" id="presenceFill"></div></div>
    <button class="play-btn" id="playBtn" type="button">🎸 Play a riff</button>
    <p class="footer-count">Ghosts banished this session: <strong id="defeatCount">–</strong></p>
  </div>

<!-- Audio players -->
<audio id="songPart1" src="../audio/song.m4a" preload="auto"></audio>
<audio id="songPart2" src="../audio/song2.m4a" preload="auto"></audio>
<!-- Audio players -->
<audio id="songPart1" src="/static/audio/song.m4a" preload="auto"></audio>
<audio id="songPart2" src="/static/audio/song2.m4a" preload="auto"></audio>

<!-- Button -->
<button onclick="playFullSong()" style="padding:12px 24px; font-size:16px; border-radius:8px; background:#1a1a1a; color:#fff; border:1px solid #444;">
  🎸 Play Theme
</button>

<script>
(function () {
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const STEP = 20;
  const PHASE2_START = 70;

  const windowEl = document.querySelector('.window');
  const specterGroup = document.getElementById('specterGroup');
  const boltsGroup = document.getElementById('boltsGroup');
  const presenceFill = document.getElementById('presenceFill');
  const presencePct = document.getElementById('presencePct');
  const presenceLabel = document.getElementById('presenceLabel');
  const playBtn = document.getElementById('playBtn');
  const resetBtn = document.getElementById('resetBtn');
  const defeatCountEl = document.getElementById('defeatCount');
  const encoreFlash = document.getElementById('encoreFlash');
  const victoryEl = document.getElementById('victory');
  const victoryDetail = document.getElementById('victoryDetail');

  let phase = 1;
  let presence = 100;
  let hits = 0;
  let defeated = 0;
  let busy = false;

  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function clearGroup(g) {
    while (g.firstChild) g.removeChild(g.firstChild);
  }

  function boltPath(cx, cy, angleDeg, length, segments) {
    const rad = angleDeg * Math.PI / 180;
    const dx = Math.cos(rad), dy = Math.sin(rad);
    let d = `M ${cx.toFixed(1)} ${cy.toFixed(1)}`;
    for (let i = 1; i <= segments; i++) {
      const t = i / segments;
      let px = cx + dx * length * t;
      let py = cy + dy * length * t;
      const wobble = 10 * (1 - t * 0.4);
      px += (Math.random() - 0.5) * wobble;
      py += (Math.random() - 0.5) * wobble;
      d += ` L ${px.toFixed(1)} ${py.toFixed(1)}`;
    }
    return d;
  }

  function spawnBolts(count) {
    clearGroup(boltsGroup);
    for (let i = 0; i < count; i++) {
      const originX = 118 + Math.random() * 64;
      const angle = -90 + (Math.random() - 0.5) * 130;
      const len = 35 + Math.random() * 45;
      const d = boltPath(originX, 291, angle, len, 4);

      const glow = document.createElementNS(SVG_NS, 'path');
      glow.setAttribute('d', d);
      glow.setAttribute('fill', 'none');
      glow.setAttribute('stroke', '#7ee8ff');
      glow.setAttribute('stroke-width', '3');
      glow.setAttribute('stroke-linecap', 'round');
      glow.setAttribute('opacity', '.8');

      const core = document.createElementNS(SVG_NS, 'path');
      core.setAttribute('d', d);
      core.setAttribute('fill', 'none');
      core.setAttribute('stroke', '#ffffff');
      core.setAttribute('stroke-width', '1');
      core.setAttribute('stroke-linecap', 'round');
      core.setAttribute('opacity', '.9');

      boltsGroup.appendChild(glow);
      boltsGroup.appendChild(core);
    }
  }

  function scatterEmbers(n) {
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      s.className = 'ember';
      s.style.left = `${38 + Math.random() * 24}%`;
      s.style.top = `${78 + Math.random() * 15}%`;
      s.style.animationDelay = `${Math.random() * 3}s`;
      windowEl.appendChild(s);
    }
  }

  function punch() {
    specterGroup.classList.remove('recoil');
    specterGroup.getBoundingClientRect();
    specterGroup.classList.add('recoil');
  }

  function updatePresenceUI() {
    const shown = Math.max(presence, 0);
    presenceFill.style.width = `${shown}%`;
    presencePct.textContent = `${shown}%`;
    presenceLabel.textContent = phase === 1 ? 'Presence' : 'Encore';
  }

  async function loadDefeats() {
    if (!window.storage) { defeatCountEl.textContent = '0'; return; }
    try {
      const res = await window.storage.get('rockstarspecter:defeats');
      defeated = (res && res.value) ? (parseInt(res.value, 10) || 0) : 0;
    } catch (e) {
      defeated = 0;
    }
    defeatCountEl.textContent = defeated;
  }

  async function saveDefeats() {
    if (!window.storage) return;
    try {
      await window.storage.set('rockstarspecter:defeats', String(defeated));
    } catch (e) {
      /* non-fatal: session count still shown, just won't persist */
    }
  }

  function playRiff() {
    if (busy) return;
    presence = Math.max(0, presence - STEP);
    hits += 1;
    punch();
    updatePresenceUI();

    if (presence <= 0) {
      busy = true;
      playBtn.disabled = true;
      if (phase === 1) {
        setTimeout(startEncore, 550);
      } else {
        setTimeout(onBanish, 550);
      }
    }
  }

  function startEncore() {
    phase = 2;
    presence = PHASE2_START;
    encoreFlash.classList.add('show');
    setTimeout(function () {
      encoreFlash.classList.remove('show');
      updatePresenceUI();
      busy = false;
      playBtn.disabled = false;
    }, 1100);
  }

  function onBanish() {
    defeated += 1;
    defeatCountEl.textContent = defeated;
    victoryDetail.textContent = `Cleared in ${hits} reps across 2 phases.`;
    victoryEl.classList.add('show');
    saveDefeats();
  }

  function resetSpecter() {
    phase = 1;
    presence = 100;
    hits = 0;
    busy = false;
    playBtn.disabled = false;
    updatePresenceUI();
    victoryEl.classList.remove('show');
  }

  playBtn.addEventListener('click', playRiff);
  resetBtn.addEventListener('click', resetSpecter);

  spawnBolts(6);
  scatterEmbers(8);
  updatePresenceUI();
  loadDefeats();

  if (!reduceMotion) {
    setInterval(function () {
      if (!busy) spawnBolts(6);
    }, 300);
  }
})();

const part1 = document.getElementById('songPart1');
const part2 = document.getElementById('songPart2');

// When part 1 ends → automatically play part 2
part1.addEventListener('ended', () => {
  part2.currentTime = 0;
  part2.play().catch(() => {});
});

function playFullSong() {
  // Stop both first (in case it’s already playing)
  part1.pause();
  part2.pause();
  part1.currentTime = 0;
  part2.currentTime = 0;

  // Start from the beginning
  part1.play().catch(() => {});
}
</script>
</body>
</html>
