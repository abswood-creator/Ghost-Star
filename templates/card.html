<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>{{ ghost.name }} — Ghost Hunter</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #0b0812;
      --iris: #211b30;
      --iris-deep: #14101f;
      --pewter-dim: #4a4558;
      --arc-violet: #9b6bff;
      --arc-violet-soft: rgba(155, 107, 255, .5);
      --arc-white: #f5f0ff;
      --relic-gold: #e8c468;
      --ink: #e7e2f2;
      --ink-dim: #948da8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 24px 16px 48px;
      background:
        radial-gradient(ellipse 620px 420px at 50% -8%, #26193f 0%, transparent 60%),
        var(--void);
      background-attachment: fixed;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--ink);
    }
    .back {
      align-self: flex-start;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: .08em;
      color: var(--arc-violet);
      text-decoration: none;
      padding: 4px 0;
    }
    .eyebrow {
      margin: 0;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--arc-violet);
      text-align: center;
    }
    .frame {
      position: relative;
      width: min(88vw, 340px);
      padding: 16px 16px 0;
      border-radius: 20px 20px 12px 12px;
      background: linear-gradient(160deg, var(--pewter-dim) 0%, var(--iris) 45%, var(--iris-deep) 100%);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, .65),
        inset 0 0 0 2px rgba(210, 200, 225, .12),
        0 24px 60px -16px rgba(0, 0, 0, .85),
        0 0 70px -14px var(--arc-violet-soft);
    }
    .frame::before {
      content: '';
      position: absolute;
      top: -7px;
      left: 50%;
      width: 13px;
      height: 13px;
      margin-left: -6.5px;
      background: linear-gradient(135deg, var(--arc-white), var(--arc-violet) 55%, #4c2f8f);
      transform: rotate(45deg);
      border-radius: 2px;
      box-shadow: 0 0 14px 3px var(--arc-violet-soft);
    }
    .window {
      position: relative;
      border-radius: 11px;
      overflow: hidden;
      min-height: 200px;
      background: radial-gradient(circle at 50% 32%, #241c33 0%, #0d0a14 68%, #06040a 100%);
      box-shadow: inset 0 0 44px rgba(0, 0, 0, .9);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .window .big-emoji {
      font-size: 88px;
      line-height: 1;
      filter: drop-shadow(0 0 24px var(--arc-violet-soft));
      animation: float 3.4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .plate { text-align: center; padding: 12px 8px 16px; }
    .plate h1 {
      margin: 2px 0 0;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: .12em;
      font-size: clamp(22px, 6vw, 28px);
      color: var(--arc-white);
      text-shadow: 0 0 14px var(--arc-violet-soft);
    }
    .plate .kind {
      margin: 4px 0 0;
      font-style: italic;
      font-size: 14px;
      color: var(--ink-dim);
    }
    .hud {
      width: min(88vw, 340px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    .hud-row span:last-child { font-weight: 600; color: var(--arc-white); }
    .charge-track {
      height: 11px;
      border-radius: 6px;
      background: var(--iris-deep);
      overflow: hidden;
    }
    .charge-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6d3fd6, var(--arc-violet) 60%, var(--arc-white));
      transition: width .35s ease;
    }
    .zap-btn {
      margin-top: 4px;
      padding: 14px 18px;
      min-height: 48px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(160deg, var(--arc-violet), #5b32b8);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: .06em;
      cursor: pointer;
      box-shadow: 0 10px 22px -8px rgba(139, 92, 246, .65);
    }
    .zap-btn:disabled { opacity: .45; cursor: default; }
    .footer {
      margin: 0;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--ink-dim);
    }
    .msg {
      margin: 0;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--relic-gold);
      white-space: pre-wrap;
      min-height: 1.4em;
    }
    .not-active {
      opacity: .7;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--ink-dim);
      padding: 8px;
    }
    @media (prefers-reduced-motion: reduce) {
      .window .big-emoji { animation: none !important; }
    }
  </style>
</head>
<body>
  <a class="back" href="/">← Roster</a>
  <p class="eyebrow">Ghost Hunter — {{ ghost.subtitle }}</p>

  <div class="frame">
    <div class="window">
      <div class="big-emoji">{{ ghost.emoji }}</div>
    </div>
    <div class="plate">
      <h1>{{ ghost.name }}</h1>
      <p class="kind">{{ ghost.subtitle }}</p>
    </div>
  </div>

  <div class="hud">
    <div class="hud-row"><span>Progress</span><span id="chargeLabel">–</span></div>
    <div class="charge-track"><div class="charge-fill" id="chargeFill"></div></div>
    <button class="zap-btn" id="zapBtn" type="button">🎸 Log practice</button>
    <p class="msg" id="msg"></p>
    <p class="footer" id="footer">Streak: – · Total: –</p>
    <p class="not-active" id="notActive" style="display:none">
      This ghost is not currently active on your run.
    </p>
  </div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#0b0812'); } catch (_) {}
  }

  const GHOST_ID = "{{ ghost.id }}";
  const REPS_NEEDED = {{ ghost.reps_needed }};
  const initData = (tg && tg.initData) || '';

  const chargeLabel = document.getElementById('chargeLabel');
  const chargeFill = document.getElementById('chargeFill');
  const zapBtn = document.getElementById('zapBtn');
  const msgEl = document.getElementById('msg');
  const footer = document.getElementById('footer');
  const notActive = document.getElementById('notActive');

  function headers() {
    const h = { 'Content-Type': 'application/json' };
    if (initData) {
      h['X-Telegram-Init-Data'] = initData;
      h['Authorization'] = 'tma ' + initData;
    }
    return h;
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { ...headers(), ...(opts.headers || {}) },
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || res.statusText || 'Request failed');
    }
    return res.json();
  }

  function applyStatus(st) {
    footer.textContent = 'Streak: ' + st.streak_days + ' · Total: ' + st.total_reps + ' · Banished: ' + st.ghosts_defeated;

    const isCurrent = st.current_ghost && st.current_ghost.id === GHOST_ID;
    const alreadyDefeated = st.roster.some(g => g.id === GHOST_ID && g.defeated);

    if (isCurrent) {
      const g = st.current_ghost;
      const pct = Math.round((g.progress / g.reps_needed) * 100);
      chargeLabel.textContent = g.progress + '/' + g.reps_needed;
      chargeFill.style.width = pct + '%';
      zapBtn.disabled = false;
      zapBtn.textContent = '🎸 Log practice';
      notActive.style.display = 'none';
    } else if (alreadyDefeated) {
      chargeLabel.textContent = REPS_NEEDED + '/' + REPS_NEEDED;
      chargeFill.style.width = '100%';
      zapBtn.disabled = true;
      zapBtn.textContent = 'Banished';
      notActive.style.display = 'block';
      notActive.textContent = 'This ghost has already been banished.';
    } else {
      chargeLabel.textContent = '0/' + REPS_NEEDED;
      chargeFill.style.width = '0%';
      zapBtn.disabled = true;
      zapBtn.textContent = 'Not yet';
      notActive.style.display = 'block';
      notActive.textContent = 'Defeat the earlier ghosts first.';
    }
  }

  zapBtn.addEventListener('click', async () => {
    if (!initData) {
      msgEl.textContent = 'Open from the Telegram bot to log practice.';
      return;
    }
    zapBtn.disabled = true;
    msgEl.textContent = '';
    try {
      const data = await api('/api/practice', { method: 'POST' });
      applyStatus(data.status);
      msgEl.textContent = (data.messages || []).join('\n');
      if (tg) {
        try {
          if (data.event && data.event.defeated_ghost) tg.HapticFeedback.notificationOccurred('success');
          else tg.HapticFeedback.impactOccurred('medium');
        } catch (_) {}
      }
      // If we just defeated this ghost, offer to go home after a beat
      if (data.event && data.event.defeated_ghost && data.event.defeated_ghost.id === GHOST_ID) {
        setTimeout(() => { location.href = '/'; }, 1800);
      }
    } catch (e) {
      msgEl.textContent = e.message || String(e);
      zapBtn.disabled = false;
    }
  });

  (async () => {
    if (!initData) {
      chargeLabel.textContent = '0/' + REPS_NEEDED;
      zapBtn.disabled = true;
      zapBtn.textContent = 'Open in Telegram';
      footer.textContent = 'Preview mode — progress only syncs inside Telegram';
      return;
    }
    try {
      const st = await api('/api/status');
      applyStatus(st);
    } catch (e) {
      msgEl.textContent = 'Could not load: ' + (e.message || e);
    }
  })();
})();
</script>
</body>
</html>
