<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>Ghost Hunter</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #0b0812;
      --iris: #211b30;
      --iris-deep: #14101f;
      --pewter-dim: #4a4558;
      --arc-violet: #9b6bff;
      --arc-violet-soft: rgba(155, 107, 255, .5);
      --arc-white: #f5f0ff;
      --relic-gold: #e8c468;
      --ink: #e7e2f2;
      --ink-dim: #948da8;
      --tg-bg: var(--tg-theme-bg-color, var(--void));
      --tg-text: var(--tg-theme-text-color, var(--ink));
      --tg-hint: var(--tg-theme-hint-color, var(--ink-dim));
      --tg-button: var(--tg-theme-button-color, var(--arc-violet));
      --tg-button-text: var(--tg-theme-button-text-color, #fff);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(ellipse 620px 420px at 50% -8%, #26193f 0%, transparent 60%),
        var(--tg-bg);
      background-attachment: fixed;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--tg-text);
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .eyebrow {
      margin: 0;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--arc-violet);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: .1em;
      font-size: clamp(22px, 6vw, 28px);
      color: var(--arc-white);
      text-align: center;
    }
    .sub {
      margin: 0;
      max-width: 320px;
      text-align: center;
      font-style: italic;
      font-size: 15px;
      color: var(--tg-hint);
      line-height: 1.4;
    }
    .card {
      width: min(92vw, 360px);
      background: linear-gradient(160deg, var(--pewter-dim) 0%, var(--iris) 45%, var(--iris-deep) 100%);
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow:
        0 0 0 1px rgba(0,0,0,.65),
        inset 0 0 0 1px rgba(210,200,225,.1),
        0 20px 50px -16px rgba(0,0,0,.8);
    }
    .ghost-hero {
      text-align: center;
      margin-bottom: 14px;
    }
    .ghost-hero .emoji { font-size: 42px; line-height: 1; }
    .ghost-hero .name {
      margin: 8px 0 2px;
      font-family: 'Cinzel', serif;
      font-size: 22px;
      letter-spacing: .08em;
      color: var(--arc-white);
    }
    .ghost-hero .kind {
      margin: 0;
      font-style: italic;
      font-size: 14px;
      color: var(--ink-dim);
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-bottom: 6px;
    }
    .hud-row span:last-child { font-weight: 600; color: var(--arc-white); }
    .charge-track {
      height: 12px;
      border-radius: 6px;
      background: var(--iris-deep);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .charge-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6d3fd6, var(--arc-violet) 60%, var(--arc-white));
      box-shadow: 0 0 12px var(--arc-violet-soft);
      transition: width .4s ease;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-align: center;
      color: var(--ink-dim);
    }
    .stats strong {
      display: block;
      font-size: 16px;
      color: var(--arc-white);
      margin-bottom: 2px;
    }
    .btn {
      width: 100%;
      padding: 14px 18px;
      min-height: 50px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(160deg, var(--arc-violet), #5b32b8);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: .06em;
      cursor: pointer;
      box-shadow: 0 10px 22px -8px rgba(139, 92, 246, .65);
    }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-secondary {
      margin-top: 10px;
      background: transparent;
      border: 1px solid var(--pewter-dim);
      color: var(--ink);
      box-shadow: none;
    }
    .msg {
      margin-top: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.5;
      color: var(--ink-dim);
      white-space: pre-wrap;
      text-align: center;
    }
    .msg.success { color: var(--relic-gold); }
    .roster {
      width: min(92vw, 360px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .roster h2 {
      margin: 8px 0 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--arc-violet);
      text-align: center;
    }
    .roster-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(33, 27, 48, .7);
      border: 1px solid rgba(155, 107, 255, .12);
      text-decoration: none;
      color: inherit;
      transition: border-color .2s;
    }
    .roster-item.current {
      border-color: var(--arc-violet);
      box-shadow: 0 0 20px -8px var(--arc-violet-soft);
    }
    .roster-item.defeated { opacity: .45; }
    .roster-item .emoji { font-size: 22px; width: 28px; text-align: center; }
    .roster-item .info { flex: 1; }
    .roster-item .info .n {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      letter-spacing: .04em;
      color: var(--arc-white);
    }
    .roster-item .info .s {
      font-size: 12px;
      font-style: italic;
      color: var(--ink-dim);
    }
    .roster-item .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--relic-gold);
    }
    .loading { opacity: .5; pointer-events: none; }
    .all-clear {
      text-align: center;
      padding: 24px 12px;
    }
    .all-clear .trophy { font-size: 48px; }
    .error {
      color: #ff8a8a;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      text-align: center;
      padding: 12px;
    }
  </style>
</head>
<body>
  <p class="eyebrow">Ghost Hunter</p>
  <h1>Practice Room</h1>
  <p class="sub">Log a session. Chip away at the ghost currently haunting the room.</p>

  <div id="app" class="loading">
    <div class="card" id="mainCard">
      <div class="ghost-hero" id="hero">
        <div class="emoji" id="heroEmoji">⚡</div>
        <p class="name" id="heroName">…</p>
        <p class="kind" id="heroKind"></p>
      </div>
      <div class="hud-row"><span>Charge</span><span id="chargeLabel">–</span></div>
      <div class="charge-track"><div class="charge-fill" id="chargeFill"></div></div>
      <div class="stats">
        <div><strong id="statStreak">0</strong>Streak</div>
        <div><strong id="statReps">0</strong>Total reps</div>
        <div><strong id="statDefeated">0</strong>Banished</div>
      </div>
      <button class="btn" id="practiceBtn" type="button">🎸 Log practice</button>
      <button class="btn btn-secondary" id="openCardBtn" type="button">Open full card</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="roster">
      <h2>The Roster</h2>
      <div id="rosterList"></div>
    </div>
  </div>

  <div id="err" class="error" style="display:none"></div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#0b0812'); } catch (_) {}
    try { tg.setBackgroundColor('#0b0812'); } catch (_) {}
  }

  const initData = (tg && tg.initData) || '';
  const appEl = document.getElementById('app');
  const errEl = document.getElementById('err');
  const practiceBtn = document.getElementById('practiceBtn');
  const openCardBtn = document.getElementById('openCardBtn');
  const msgEl = document.getElementById('msg');

  let status = null;

  function headers() {
    const h = { 'Content-Type': 'application/json' };
    if (initData) {
      h['X-Telegram-Init-Data'] = initData;
      h['Authorization'] = 'tma ' + initData;
    }
    return h;
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { ...headers(), ...(opts.headers || {}) },
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || res.statusText || 'Request failed');
    }
    return res.json();
  }

  function render(st) {
    status = st;
    appEl.classList.remove('loading');

    if (st.all_clear) {
      document.getElementById('heroEmoji').textContent = '🏆';
      document.getElementById('heroName').textContent = 'Room Clear';
      document.getElementById('heroKind').textContent = 'All 5 ghosts banished';
      document.getElementById('chargeLabel').textContent = 'Done';
      document.getElementById('chargeFill').style.width = '100%';
      practiceBtn.disabled = true;
      practiceBtn.textContent = 'All clear';
      openCardBtn.style.display = 'none';
    } else {
      const g = st.current_ghost;
      document.getElementById('heroEmoji').textContent = g.emoji;
      document.getElementById('heroName').textContent = g.name;
      document.getElementById('heroKind').textContent = g.subtitle;
      const pct = Math.round((g.progress / g.reps_needed) * 100);
      document.getElementById('chargeLabel').textContent = g.progress + '/' + g.reps_needed;
      document.getElementById('chargeFill').style.width = pct + '%';
      practiceBtn.disabled = false;
      practiceBtn.textContent = '🎸 Log practice';
      openCardBtn.style.display = '';
      openCardBtn.onclick = () => { location.href = '/card/' + g.id; };
    }

    document.getElementById('statStreak').textContent = st.streak_days;
    document.getElementById('statReps').textContent = st.total_reps;
    document.getElementById('statDefeated').textContent = st.ghosts_defeated;

    const list = document.getElementById('rosterList');
    list.innerHTML = '';
    st.roster.forEach(g => {
      const a = document.createElement('a');
      a.className = 'roster-item' + (g.current ? ' current' : '') + (g.defeated ? ' defeated' : '');
      a.href = '/card/' + g.id;
      a.innerHTML =
        '<span class="emoji">' + g.emoji + '</span>' +
        '<div class="info"><div class="n">' + g.name + '</div><div class="s">' + g.subtitle + '</div></div>' +
        (g.defeated ? '<span class="badge">Banished</span>' : g.current ? '<span class="badge">Active</span>' : '');
      list.appendChild(a);
    });
  }

  practiceBtn.addEventListener('click', async () => {
    practiceBtn.disabled = true;
    msgEl.textContent = '';
    msgEl.classList.remove('success');
    try {
      const data = await api('/api/practice', { method: 'POST' });
      render(data.status);
      msgEl.textContent = (data.messages || []).join('\n');
      msgEl.classList.add('success');
      if (tg && data.event && data.event.defeated_ghost) {
        try { tg.HapticFeedback.notificationOccurred('success'); } catch (_) {}
      } else if (tg) {
        try { tg.HapticFeedback.impactOccurred('medium'); } catch (_) {}
      }
    } catch (e) {
      msgEl.textContent = e.message || String(e);
    } finally {
      if (status && !status.all_clear) practiceBtn.disabled = false;
    }
  });

  // Boot
  (async () => {
    if (!initData) {
      // Outside Telegram — show a friendly note, still allow browsing cards
      errEl.style.display = 'block';
      errEl.textContent = 'Open this page from the Telegram bot menu button for full progress sync.';
      // Still show a static roster so the separate cards are reachable
      const fake = {
        all_clear: false,
        streak_days: 0,
        total_reps: 0,
        ghosts_defeated: 0,
        current_ghost: {
          id: 'sparky', name: 'Sparky', subtitle: 'Tiny Electric Ghost',
          emoji: '⚡', progress: 0, reps_needed: 5
        },
        roster: [
          {% for g in ghosts %}
          { id: "{{ g.id }}", name: "{{ g.name }}", subtitle: "{{ g.subtitle }}", emoji: "{{ g.emoji }}", defeated: false, current: {{ 'true' if loop.first else 'false' }} },
          {% endfor %}
        ]
      };
      render(fake);
      practiceBtn.disabled = true;
      return;
    }
    try {
      const st = await api('/api/status');
      render(st);
    } catch (e) {
      errEl.style.display = 'block';
      errEl.textContent = 'Could not load status: ' + (e.message || e);
      appEl.classList.remove('loading');
    }
  })();
})();
</script>
</body>
</html>
